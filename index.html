<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="UI Design Atlas — interactive open-source interfaces, design notes, prompts and reusable code."
    />
    <meta name="theme-color" content="#ffffff" />
    <title>UI Design Atlas</title>
    <link rel="icon" href="./favicon.svg" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a
      class="skip"
      href="#main"
      onclick="
        event.preventDefault();
        document.getElementById('main').focus();
      "
      >跳转到内容 / Skip to content</a
    >
    <aside id="sidebar"></aside>
    <div class="workspace">
      <header id="topbar"></header>
      <main id="main" tabindex="-1"></main>
      <footer id="footer"></footer>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="copy-fallback">
      <div class="dialog-head">
        <strong id="copy-title"></strong
        ><button id="fallback-close" aria-label="Close">×</button>
      </div>
      <p id="copy-help"></p>
      <textarea id="fallback-text" readonly></textarea>
    </dialog>
    <dialog id="search-dialog" aria-label="搜索设计 / Search designs">
      <div class="search-dialog-input">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          aria-hidden="true"
        >
          <circle cx="10.5" cy="10.5" r="7.5" />
          <path d="m16 16 5 5" /></svg
        ><input
          id="quick-search"
          type="search"
          autocomplete="off"
          aria-label="搜索设计 / Search designs"
        /><button data-close-search aria-label="Close search">Esc</button>
      </div>
      <div id="search-results"></div>
      <div class="search-dialog-footer">
        UI Design Atlas <span>↵ ${'Open'} · Esc ${'Close'}</span>
      </div>
    </dialog>
    <script type="module" src="./app.js"></script>
  </body>
</html>
