<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Swipe Confirm</title>
    <link rel="stylesheet" href="../shared/demo.css">
    <script src="../shared/demo.js" defer></script>
  </head>
  <body data-resource="ui-moments-swipe-confirm" data-demo="swipe-confirm">
    <main id="root">
      <header>
        <h1 data-zh="滑动确认" data-en="Swipe Confirm">Swipe Confirm</h1>
        <p data-zh="拖到末端才确认，未达阈值会回弹。" data-en="Confirm at the end of the rail; shorter drags spring back.">Confirm at the end of the rail; shorter drags spring back.</p>
      </header>
      <section id="stage" aria-label="UI Moments">
        <div id="demo"></div>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
      <footer>
        <button id="pause" type="button" aria-pressed="false" data-zh="暂停动效" data-en="Pause motion">Pause motion</button>
      </footer>
    </main>
  </body>
</html>
