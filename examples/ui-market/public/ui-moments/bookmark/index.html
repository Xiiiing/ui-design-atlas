<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bookmark</title>
    <link rel="stylesheet" href="../shared/demo.css">
    <script src="../shared/demo.js" defer></script>
  </head>
  <body data-resource="ui-moments-bookmark" data-demo="bookmark">
    <main>
      <header>
        <h1 data-zh="收藏书签" data-en="Bookmark">Bookmark</h1>
        <p data-zh="切换收藏，书签轮廓填实并轻微上提。" data-en="Toggle a bookmark as its outline fills and lifts.">Toggle a bookmark as its outline fills and lifts.</p>
      </header>
      <section id="stage" aria-label="UI Moments">
        <div id="demo"></div>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
      <footer>
        <button id="pause" type="button" aria-pressed="false" data-zh="暂停动效" data-en="Pause motion">Pause motion</button>
      </footer>
    </main>
  </body>
</html>
