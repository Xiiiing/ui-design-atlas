<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detent Dial</title>
    <link rel="stylesheet" href="../shared/demo.css">
    <script src="../shared/demo.js" defer></script>
  </head>
  <body data-resource="ui-moments-detent-dial" data-demo="detent-dial">
    <main id="root">
      <header>
        <h1 data-zh="刻度旋钮" data-en="Detent Dial">Detent Dial</h1>
        <p data-zh="使用滑块或方向键切换十二个旋钮档位。" data-en="Select one of twelve dial detents with the range or arrow keys.">Select one of twelve dial detents with the range or arrow keys.</p>
      </header>
      <section id="stage" aria-label="UI Moments">
        <div id="demo"></div>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
      <footer>
        <button id="pause" type="button" aria-pressed="false" data-zh="暂停动效" data-en="Pause motion">Pause motion</button>
      </footer>
    </main>
  </body>
</html>
