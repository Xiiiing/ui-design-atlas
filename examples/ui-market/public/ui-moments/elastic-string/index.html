<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Elastic String</title>
    <link rel="stylesheet" href="../shared/demo.css">
    <script src="../shared/demo.js" defer></script>
  </head>
  <body data-resource="ui-moments-elastic-string" data-demo="elastic-string">
    <main>
      <header>
        <h1 data-zh="弹性弦线" data-en="Elastic String">Elastic String</h1>
        <p data-zh="点击弦线或拨动按钮，观察阻尼回弹。" data-en="Pluck the string or press its button to see a damped vibration.">Pluck the string or press its button to see a damped vibration.</p>
      </header>
      <section id="stage" aria-label="UI Moments">
        <div id="demo"></div>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
      <footer>
        <button id="pause" type="button" aria-pressed="false" data-zh="暂停动效" data-en="Pause motion">Pause motion</button>
      </footer>
    </main>
  </body>
</html>
