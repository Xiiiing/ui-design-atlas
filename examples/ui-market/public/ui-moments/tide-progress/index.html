<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tide Progress</title>
    <link rel="stylesheet" href="../shared/demo.css">
    <script src="../shared/demo.js" defer></script>
  </head>
  <body data-resource="ui-moments-tide-progress" data-demo="tide-progress">
    <main>
      <header>
        <h1 data-zh="潮汐进度" data-en="Tide Progress">Tide Progress</h1>
        <p data-zh="拖动进度，圆形容器中的波浪随读数升降。" data-en="Move the range to raise the waves with the progress value.">Move the range to raise the waves with the progress value.</p>
      </header>
      <section id="stage" aria-label="UI Moments">
        <div id="demo"></div>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
      <footer>
        <button id="pause" type="button" aria-pressed="false" data-zh="暂停动效" data-en="Pause motion">Pause motion</button>
      </footer>
    </main>
  </body>
</html>
