<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Squash Play</title>
    <link rel="stylesheet" href="../shared/demo.css">
    <script src="../shared/demo.js" defer></script>
  </head>
  <body data-resource="ui-moments-squash-play" data-demo="squash-play">
    <main>
      <header>
        <h1 data-zh="压键播放" data-en="Squash Play">Squash Play</h1>
        <p data-zh="按下播放键，厚按钮压低并切换暂停图标。" data-en="A thick play key compresses and swaps to pause.">A thick play key compresses and swaps to pause.</p>
      </header>
      <section id="stage" aria-label="UI Moments">
        <div id="demo"></div>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
      <footer>
        <button id="pause" type="button" aria-pressed="false" data-zh="暂停动效" data-en="Pause motion">Pause motion</button>
      </footer>
    </main>
  </body>
</html>
