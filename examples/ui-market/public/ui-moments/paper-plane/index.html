<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Paper Plane</title>
    <link rel="stylesheet" href="../shared/demo.css">
    <script src="../shared/demo.js" defer></script>
  </head>
  <body data-resource="ui-moments-paper-plane" data-demo="paper-plane">
    <main id="root">
      <header>
        <h1 data-zh="纸飞机发送" data-en="Paper Plane">Paper Plane</h1>
        <p data-zh="点发送，纸飞机沿弧线飞出后显示完成。" data-en="A paper plane takes off and the button settles into a sent state.">A paper plane takes off and the button settles into a sent state.</p>
      </header>
      <section id="stage" aria-label="UI Moments">
        <div id="demo"></div>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
      <footer>
        <button id="pause" type="button" aria-pressed="false" data-zh="暂停动效" data-en="Pause motion">Pause motion</button>
      </footer>
    </main>
  </body>
</html>
