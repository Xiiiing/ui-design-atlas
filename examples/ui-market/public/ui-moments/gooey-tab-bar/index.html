<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gooey Tab Bar</title>
    <link rel="stylesheet" href="../shared/demo.css">
    <script src="../shared/demo.js" defer></script>
  </head>
  <body data-resource="ui-moments-gooey-tab-bar" data-demo="gooey-tab-bar">
    <main id="root">
      <header>
        <h1 data-zh="弹性标签栏" data-en="Gooey Tab Bar">Gooey Tab Bar</h1>
        <p data-zh="切换图标标签，实心指示块弹性跟随。" data-en="A rounded selection follows the active icon with a spring.">A rounded selection follows the active icon with a spring.</p>
      </header>
      <section id="stage" aria-label="UI Moments">
        <div id="demo"></div>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
      <footer>
        <button id="pause" type="button" aria-pressed="false" data-zh="暂停动效" data-en="Pause motion">Pause motion</button>
      </footer>
    </main>
  </body>
</html>
