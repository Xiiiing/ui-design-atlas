<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Checklist</title>
    <link rel="stylesheet" href="../shared/demo.css">
    <script src="../shared/demo.js" defer></script>
  </head>
  <body data-resource="ui-moments-checklist" data-demo="checklist">
    <main id="root">
      <header>
        <h1 data-zh="划线清单" data-en="Checklist">Checklist</h1>
        <p data-zh="独立勾选任务，文字划线并更新完成数。" data-en="Check tasks independently with strikes and a completion count.">Check tasks independently with strikes and a completion count.</p>
      </header>
      <section id="stage" aria-label="UI Moments">
        <div id="demo"></div>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
      <footer>
        <button id="pause" type="button" aria-pressed="false" data-zh="暂停动效" data-en="Pause motion">Pause motion</button>
      </footer>
    </main>
  </body>
</html>
