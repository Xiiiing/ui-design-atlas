<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ripple Pad</title>
    <link rel="stylesheet" href="../shared/demo.css">
    <script src="../shared/demo.js" defer></script>
  </head>
  <body data-resource="ui-moments-ripple-pad" data-demo="ripple-pad">
    <main>
      <header>
        <h1 data-zh="涟漪画板" data-en="Ripple Pad">Ripple Pad</h1>
        <p data-zh="从点击位置展开多层涟漪，键盘从中心触发。" data-en="Ripples expand from the pointer, or the center for keyboard activation.">Ripples expand from the pointer, or the center for keyboard activation.</p>
      </header>
      <section id="stage" aria-label="UI Moments">
        <div id="demo"></div>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
      <footer>
        <button id="pause" type="button" aria-pressed="false" data-zh="暂停动效" data-en="Pause motion">Pause motion</button>
      </footer>
    </main>
  </body>
</html>
