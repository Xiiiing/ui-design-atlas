<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Card Fan</title>
    <link rel="stylesheet" href="../shared/demo.css">
    <script src="../shared/demo.js" defer></script>
  </head>
  <body data-resource="ui-moments-card-fan" data-demo="card-fan">
    <main id="root">
      <header>
        <h1 data-zh="扇形卡组" data-en="Card Fan">Card Fan</h1>
        <p data-zh="悬停或点按，让叠放卡片扇形展开。" data-en="Fan out a stack of cards on hover or activation.">Fan out a stack of cards on hover or activation.</p>
      </header>
      <section id="stage" aria-label="UI Moments">
        <div id="demo"></div>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
      <footer>
        <button id="pause" type="button" aria-pressed="false" data-zh="暂停动效" data-en="Pause motion">Pause motion</button>
      </footer>
    </main>
  </body>
</html>
