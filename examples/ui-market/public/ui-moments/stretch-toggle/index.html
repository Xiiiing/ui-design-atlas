<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stretch Toggle</title>
    <link rel="stylesheet" href="../shared/demo.css">
    <script src="../shared/demo.js" defer></script>
  </head>
  <body data-resource="ui-moments-stretch-toggle" data-demo="stretch-toggle">
    <main id="root">
      <header>
        <h1 data-zh="拉伸开关" data-en="Stretch Toggle">Stretch Toggle</h1>
        <p data-zh="圆形把手在切换时横移，按住时拉宽。" data-en="The thumb moves on toggle and stretches while pressed.">The thumb moves on toggle and stretches while pressed.</p>
      </header>
      <section id="stage" aria-label="UI Moments">
        <div id="demo"></div>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
      <footer>
        <button id="pause" type="button" aria-pressed="false" data-zh="暂停动效" data-en="Pause motion">Pause motion</button>
      </footer>
    </main>
  </body>
</html>
