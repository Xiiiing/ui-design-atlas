<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rubber Search</title>
    <link rel="stylesheet" href="../shared/demo.css">
    <script src="../shared/demo.js" defer></script>
  </head>
  <body data-resource="ui-moments-rubber-search" data-demo="rubber-search">
    <main id="root">
      <header>
        <h1 data-zh="橡皮搜索" data-en="Rubber Search">Rubber Search</h1>
        <p data-zh="点击搜索展开输入，回车反馈关键词，Escape 收起。" data-en="Expand the search, submit a term, or collapse with Escape.">Expand the search, submit a term, or collapse with Escape.</p>
      </header>
      <section id="stage" aria-label="UI Moments">
        <div id="demo"></div>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
      <footer>
        <button id="pause" type="button" aria-pressed="false" data-zh="暂停动效" data-en="Pause motion">Pause motion</button>
      </footer>
    </main>
  </body>
</html>
