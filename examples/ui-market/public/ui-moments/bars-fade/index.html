<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bars Fade</title>
    <link rel="stylesheet" href="../shared/demo.css">
    <script src="../shared/demo.js" defer></script>
  </head>
  <body data-resource="ui-moments-bars-fade" data-demo="bars-fade">
    <main id="root">
      <header>
        <h1 data-zh="条形渐隐" data-en="Bars Fade">Bars Fade</h1>
        <p data-zh="观察节奏，使用下方按钮暂停。" data-en="Watch the rhythm. Pause using the control below.">Watch the rhythm. Pause using the control below.</p>
      </header>
      <section id="stage" aria-label="UI Moments">
        <div id="demo"></div>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
      <footer>
        <button id="pause" type="button" aria-pressed="false" data-zh="暂停动效" data-en="Pause motion">Pause motion</button>
      </footer>
    </main>
  </body>
</html>
