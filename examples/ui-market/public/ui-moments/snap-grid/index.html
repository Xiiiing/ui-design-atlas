<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Snap Grid</title>
    <link rel="stylesheet" href="../shared/demo.css">
    <script src="../shared/demo.js" defer></script>
  </head>
  <body data-resource="ui-moments-snap-grid" data-demo="snap-grid">
    <main id="root">
      <header>
        <h1 data-zh="吸附网格" data-en="Snap Grid">Snap Grid</h1>
        <p data-zh="拖动或点选九宫格，让方块吸附到目标格。" data-en="Drag or select a cell to snap a tile into place.">Drag or select a cell to snap a tile into place.</p>
      </header>
      <section id="stage" aria-label="UI Moments">
        <div id="demo"></div>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
      <footer>
        <button id="pause" type="button" aria-pressed="false" data-zh="暂停动效" data-en="Pause motion">Pause motion</button>
      </footer>
    </main>
  </body>
</html>
