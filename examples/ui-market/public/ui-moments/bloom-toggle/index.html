<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bloom Toggle</title>
    <link rel="stylesheet" href="../shared/demo.css">
    <script src="../shared/demo.js" defer></script>
  </head>
  <body data-resource="ui-moments-bloom-toggle" data-demo="bloom-toggle">
    <main>
      <header>
        <h1 data-zh="花瓣开关" data-en="Bloom Toggle">Bloom Toggle</h1>
        <p data-zh="点击让六片花瓣围绕中心展开或收拢。" data-en="Open or close six petals around a stable center.">Open or close six petals around a stable center.</p>
      </header>
      <section id="stage" aria-label="UI Moments">
        <div id="demo"></div>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
      <footer>
        <button id="pause" type="button" aria-pressed="false" data-zh="暂停动效" data-en="Pause motion">Pause motion</button>
      </footer>
    </main>
  </body>
</html>
