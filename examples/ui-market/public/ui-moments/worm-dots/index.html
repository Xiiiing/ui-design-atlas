<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Worm Dots</title>
    <link rel="stylesheet" href="../shared/demo.css">
    <script src="../shared/demo.js" defer></script>
  </head>
  <body data-resource="ui-moments-worm-dots" data-demo="worm-dots">
    <main>
      <header>
        <h1 data-zh="蠕动分页点" data-en="Worm Dots">Worm Dots</h1>
        <p data-zh="点选页码，圆角指示块跟随当前分页。" data-en="Select a page as the rounded indicator follows it.">Select a page as the rounded indicator follows it.</p>
      </header>
      <section id="stage" aria-label="UI Moments">
        <div id="demo"></div>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
      <footer>
        <button id="pause" type="button" aria-pressed="false" data-zh="暂停动效" data-en="Pause motion">Pause motion</button>
      </footer>
    </main>
  </body>
</html>
