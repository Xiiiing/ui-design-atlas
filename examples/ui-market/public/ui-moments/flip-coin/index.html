<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flip Coin</title>
    <link rel="stylesheet" href="../shared/demo.css">
    <script src="../shared/demo.js" defer></script>
  </head>
  <body data-resource="ui-moments-flip-coin" data-demo="flip-coin">
    <main id="root">
      <header>
        <h1 data-zh="翻转硬币" data-en="Flip Coin">Flip Coin</h1>
        <p data-zh="点击硬币，在正反两面之间翻转。" data-en="Flip the coin between its two faces.">Flip the coin between its two faces.</p>
      </header>
      <section id="stage" aria-label="UI Moments">
        <div id="demo"></div>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
      <footer>
        <button id="pause" type="button" aria-pressed="false" data-zh="暂停动效" data-en="Pause motion">Pause motion</button>
      </footer>
    </main>
  </body>
</html>
