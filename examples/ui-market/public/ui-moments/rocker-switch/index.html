<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rocker Switch</title>
    <link rel="stylesheet" href="../shared/demo.css">
    <script src="../shared/demo.js" defer></script>
  </head>
  <body data-resource="ui-moments-rocker-switch" data-demo="rocker-switch">
    <main>
      <header>
        <h1 data-zh="翘板开关" data-en="Rocker Switch">Rocker Switch</h1>
        <p data-zh="切换电源，让 I/O 翘板向另一侧倾斜。" data-en="Toggle power as the I/O rocker tilts to the opposite side.">Toggle power as the I/O rocker tilts to the opposite side.</p>
      </header>
      <section id="stage" aria-label="UI Moments">
        <div id="demo"></div>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
      <footer>
        <button id="pause" type="button" aria-pressed="false" data-zh="暂停动效" data-en="Pause motion">Pause motion</button>
      </footer>
    </main>
  </body>
</html>
