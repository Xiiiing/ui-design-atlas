<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pebble Rating</title>
    <link rel="stylesheet" href="../shared/demo.css">
    <script src="../shared/demo.js" defer></script>
  </head>
  <body data-resource="ui-moments-pebble-rating" data-demo="pebble-rating">
    <main id="root">
      <header>
        <h1 data-zh="石子评分" data-en="Pebble Rating">Pebble Rating</h1>
        <p data-zh="选择五档评分，已选石子抬高并填色。" data-en="Choose a rating as selected pebbles rise and fill.">Choose a rating as selected pebbles rise and fill.</p>
      </header>
      <section id="stage" aria-label="UI Moments">
        <div id="demo"></div>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
      <footer>
        <button id="pause" type="button" aria-pressed="false" data-zh="暂停动效" data-en="Pause motion">Pause motion</button>
      </footer>
    </main>
  </body>
</html>
