<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Menu Morph</title>
    <link rel="stylesheet" href="../shared/demo.css">
    <script src="../shared/demo.js" defer></script>
  </head>
  <body data-resource="ui-moments-menu-morph" data-demo="menu-morph">
    <main>
      <header>
        <h1 data-zh="菜单变形" data-en="Menu Morph">Menu Morph</h1>
        <p data-zh="菜单线条变成关闭符号，再点收回。" data-en="Morph three menu strokes into a close mark and back.">Morph three menu strokes into a close mark and back.</p>
      </header>
      <section id="stage" aria-label="UI Moments">
        <div id="demo"></div>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
      <footer>
        <button id="pause" type="button" aria-pressed="false" data-zh="暂停动效" data-en="Pause motion">Pause motion</button>
      </footer>
    </main>
  </body>
</html>
