<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Domino Row</title>
    <link rel="stylesheet" href="../shared/demo.css">
    <script src="../shared/demo.js" defer></script>
  </head>
  <body data-resource="ui-moments-domino-row" data-demo="domino-row">
    <main>
      <header>
        <h1 data-zh="多米诺骨牌" data-en="Domino Row">Domino Row</h1>
        <p data-zh="点击让一排骨牌依次倒下，再点复位。" data-en="Tip a row of dominoes in sequence and reset it with another click.">Tip a row of dominoes in sequence and reset it with another click.</p>
      </header>
      <section id="stage" aria-label="UI Moments">
        <div id="demo"></div>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
      <footer>
        <button id="pause" type="button" aria-pressed="false" data-zh="暂停动效" data-en="Pause motion">Pause motion</button>
      </footer>
    </main>
  </body>
</html>
