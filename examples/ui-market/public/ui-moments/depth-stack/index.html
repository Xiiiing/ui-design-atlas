<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Depth Stack</title>
    <link rel="stylesheet" href="../shared/demo.css">
    <script src="../shared/demo.js" defer></script>
  </head>
  <body data-resource="ui-moments-depth-stack" data-demo="depth-stack">
    <main id="root">
      <header>
        <h1 data-zh="纵深卡堆" data-en="Depth Stack">Depth Stack</h1>
        <p data-zh="点击叠层卡片，让卡堆展开成透视序列。" data-en="Spread layered cards into a perspective sequence.">Spread layered cards into a perspective sequence.</p>
      </header>
      <section id="stage" aria-label="UI Moments">
        <div id="demo"></div>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
      <footer>
        <button id="pause" type="button" aria-pressed="false" data-zh="暂停动效" data-en="Pause motion">Pause motion</button>
      </footer>
    </main>
  </body>
</html>
