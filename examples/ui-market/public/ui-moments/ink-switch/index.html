<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ink Switch</title>
    <link rel="stylesheet" href="../shared/demo.css">
    <script src="../shared/demo.js" defer></script>
  </head>
  <body data-resource="ui-moments-ink-switch" data-demo="ink-switch">
    <main id="root">
      <header>
        <h1 data-zh="墨滴开关" data-en="Ink Switch">Ink Switch</h1>
        <p data-zh="墨色从圆点扩散填满轨道，再次点击收回。" data-en="Ink expands from a dot across the rail and recedes on toggle.">Ink expands from a dot across the rail and recedes on toggle.</p>
      </header>
      <section id="stage" aria-label="UI Moments">
        <div id="demo"></div>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
      <footer>
        <button id="pause" type="button" aria-pressed="false" data-zh="暂停动效" data-en="Pause motion">Pause motion</button>
      </footer>
    </main>
  </body>
</html>
