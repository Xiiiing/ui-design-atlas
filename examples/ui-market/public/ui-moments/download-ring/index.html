<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Download Ring</title>
    <link rel="stylesheet" href="../shared/demo.css">
    <script src="../shared/demo.js" defer></script>
  </head>
  <body data-resource="ui-moments-download-ring" data-demo="download-ring">
    <main id="root">
      <header>
        <h1 data-zh="下载进度环" data-en="Download Ring">Download Ring</h1>
        <p data-zh="环形进度完成后生成可下载的本地演示文件。" data-en="A progress ring completes and generates a local demo file.">A progress ring completes and generates a local demo file.</p>
      </header>
      <section id="stage" aria-label="UI Moments">
        <div id="demo"></div>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
      <footer>
        <button id="pause" type="button" aria-pressed="false" data-zh="暂停动效" data-en="Pause motion">Pause motion</button>
      </footer>
    </main>
  </body>
</html>
