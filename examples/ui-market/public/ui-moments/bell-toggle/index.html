<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bell Toggle</title>
    <link rel="stylesheet" href="../shared/demo.css">
    <script src="../shared/demo.js" defer></script>
  </head>
  <body data-resource="ui-moments-bell-toggle" data-demo="bell-toggle">
    <main>
      <header>
        <h1 data-zh="通知铃开关" data-en="Bell Toggle">Bell Toggle</h1>
        <p data-zh="点击开关通知，开启时铃铛轻晃。" data-en="Toggle notifications with a short bell swing on activation.">Toggle notifications with a short bell swing on activation.</p>
      </header>
      <section id="stage" aria-label="UI Moments">
        <div id="demo"></div>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
      <footer>
        <button id="pause" type="button" aria-pressed="false" data-zh="暂停动效" data-en="Pause motion">Pause motion</button>
      </footer>
    </main>
  </body>
</html>
