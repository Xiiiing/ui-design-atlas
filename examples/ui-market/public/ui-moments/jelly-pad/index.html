<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jelly Pad</title>
    <link rel="stylesheet" href="../shared/demo.css">
    <script src="../shared/demo.js" defer></script>
  </head>
  <body data-resource="ui-moments-jelly-pad" data-demo="jelly-pad">
    <main id="root">
      <header>
        <h1 data-zh="果冻方块" data-en="Jelly Pad">Jelly Pad</h1>
        <p data-zh="点按方块，先压扁再弹起回到原位。" data-en="Press the pad to squash, bounce and settle.">Press the pad to squash, bounce and settle.</p>
      </header>
      <section id="stage" aria-label="UI Moments">
        <div id="demo"></div>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
      <footer>
        <button id="pause" type="button" aria-pressed="false" data-zh="暂停动效" data-en="Pause motion">Pause motion</button>
      </footer>
    </main>
  </body>
</html>
