<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Odometer</title>
    <link rel="stylesheet" href="../shared/demo.css">
    <script src="../shared/demo.js" defer></script>
  </head>
  <body data-resource="ui-moments-odometer" data-demo="odometer">
    <main>
      <header>
        <h1 data-zh="滚轮步进器" data-en="Odometer">Odometer</h1>
        <p data-zh="加减数值，数字垂直滚入新位置。" data-en="Increment or decrement a value as digits roll into place.">Increment or decrement a value as digits roll into place.</p>
      </header>
      <section id="stage" aria-label="UI Moments">
        <div id="demo"></div>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
      <footer>
        <button id="pause" type="button" aria-pressed="false" data-zh="暂停动效" data-en="Pause motion">Pause motion</button>
      </footer>
    </main>
  </body>
</html>
