<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Magnet Grid</title>
    <link rel="stylesheet" href="../shared/demo.css">
    <script src="../shared/demo.js" defer></script>
  </head>
  <body data-resource="ui-moments-magnet-grid" data-demo="magnet-grid">
    <main>
      <header>
        <h1 data-zh="磁吸点阵" data-en="Magnet Grid">Magnet Grid</h1>
        <p data-zh="移动指针或使用方向键，让点阵向目标聚拢。" data-en="Move the pointer or arrow keys to attract nearby dots.">Move the pointer or arrow keys to attract nearby dots.</p>
      </header>
      <section id="stage" aria-label="UI Moments">
        <div id="demo"></div>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
      <footer>
        <button id="pause" type="button" aria-pressed="false" data-zh="暂停动效" data-en="Pause motion">Pause motion</button>
      </footer>
    </main>
  </body>
</html>
