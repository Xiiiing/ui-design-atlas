<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Radial Menu</title>
    <link rel="stylesheet" href="../shared/demo.css">
    <script src="../shared/demo.js" defer></script>
  </head>
  <body data-resource="ui-moments-radial-menu" data-demo="radial-menu">
    <main>
      <header>
        <h1 data-zh="环形快捷菜单" data-en="Radial Menu">Radial Menu</h1>
        <p data-zh="点加号展开五个快捷入口，选择后收回并返回焦点。" data-en="Open five radial actions, then choose one and restore focus.">Open five radial actions, then choose one and restore focus.</p>
      </header>
      <section id="stage" aria-label="UI Moments">
        <div id="demo"></div>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
      <footer>
        <button id="pause" type="button" aria-pressed="false" data-zh="暂停动效" data-en="Pause motion">Pause motion</button>
      </footer>
    </main>
  </body>
</html>
