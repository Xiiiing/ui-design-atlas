<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scroll Minimap</title>
    <link rel="stylesheet" href="./effect.css" />
    <link rel="stylesheet" href="../preview.css" />
    <script src="./effect.js" defer></script>
    <script src="../preview.js" defer></script>
  </head>
  <body
    data-resource="effect-atlas-scroll-minimap"
    data-mount="mountScrollMinimap"
  >
    <main id="root">
      <header>
        <h1 id="title" data-zh="滚动小地图">Scroll Minimap</h1>
        <p id="hint" data-zh="滚动示例页面，或点小地图中的任意章节。">
          Scroll the sample page or choose a section on the map.
        </p>
      </header>
      <div
        id="stage"
        role="region"
        aria-labelledby="title"
        aria-describedby="hint"
      ></div>
    </main>
  </body>
</html>
