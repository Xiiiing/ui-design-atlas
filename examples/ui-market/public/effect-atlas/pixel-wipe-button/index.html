<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixel Wipe Button</title>
    <link rel="stylesheet" href="./effect.css" />
    <link rel="stylesheet" href="../preview.css" />
    <script src="./effect.js" defer></script>
    <script src="../preview.js" defer></script>
  </head>
  <body
    data-resource="effect-atlas-pixel-wipe-button"
    data-mount="mountPixelWipeButton"
  >
    <main id="root">
      <header>
        <h1 id="title" data-zh="像素擦除按钮">Pixel Wipe Button</h1>
        <p id="hint" data-zh="悬停、聚焦或点按按钮，观察像素扫过。">
          Hover, focus or tap a button to see the pixel sweep.
        </p>
      </header>
      <div
        id="stage"
        role="region"
        aria-labelledby="title"
        aria-describedby="hint"
      ></div>
    </main>
  </body>
</html>
