<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crosshair Image Reveal</title>
    <link rel="stylesheet" href="./effect.css" />
    <link rel="stylesheet" href="../preview.css" />
    <script src="./effect.js" defer></script>
    <script src="../preview.js" defer></script>
  </head>
  <body
    data-resource="effect-atlas-crosshair-image-reveal"
    data-mount="mountCrosshairImageReveal"
  >
    <main id="root">
      <header>
        <h1 id="title" data-zh="十字线揭图">Crosshair Image Reveal</h1>
        <p id="hint" data-zh="拖动蓝点、在图上滚动，或聚焦后用方向键。">
          Drag the blue point, scroll over the image, or use the arrow keys.
        </p>
      </header>
      <div
        id="stage"
        role="region"
        aria-labelledby="title"
        aria-describedby="hint"
      ></div>
    </main>
  </body>
</html>
