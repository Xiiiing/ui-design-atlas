<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shared Element Transition</title>
    <link rel="stylesheet" href="./effect.css" />
    <link rel="stylesheet" href="../preview.css" />
    <script src="./effect.js" defer></script>
    <script src="../preview.js" defer></script>
  </head>
  <body
    data-resource="effect-atlas-shared-element-transition"
    data-mount="mountSharedElementTransition"
  >
    <main id="root">
      <header>
        <h1 id="title" data-zh="共享元素转场">Shared Element Transition</h1>
        <p id="hint" data-zh="打开一张缩略图，再次激活它即可返回。">
          Open a tile. Activate it again to return to the list.
        </p>
      </header>
      <div
        id="stage"
        role="region"
        aria-labelledby="title"
        aria-describedby="hint"
      ></div>
    </main>
  </body>
</html>
